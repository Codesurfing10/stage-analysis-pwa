services:
  - type: web
    name: stage-analysis-pwa
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: STAGE_APP_PIN
        sync: false
      - key: BOT_ROOT
        value: /app/vendor/trading-bot
      - key: EQUITY_SCAN_DIR
        value: /app/vendor/equity-scan
